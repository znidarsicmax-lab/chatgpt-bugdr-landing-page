name: Publish Bug.dr landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract complete static export
        run: |
          mkdir -p _site
          tar -xzf site.tar.gz -C _site
          test -f _site/index.html
          test -f _site/contests-past.png
          test -f _site/profile.png
          test -f _site/solve-page-ai-chat.png
          test -f _site/screenshots/problem-detail.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
